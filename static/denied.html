<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Access denied</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f4;
    color: #262626;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #171717; color: #e5e5e5; }
    .card { background: #262626; border-color: #404040; }
    .email { background: #171717; }
    a { color: #7dd3fc; }
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 32px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 16px;
  }
  .email {
    background: #f5f5f4;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    word-break: break-all;
    margin: 0 0 20px;
  }
  a {
    color: #0369a1;
    text-decoration: none;
    font-size: 15px;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Access denied</h1>
    <p>You're signed in, but this Google account isn't on the family list for this site.</p>
    <p class="email" id="who">Checking sign-in status&hellip;</p>
    <p>If this is a mistake, get in touch and I (Ryan) will add you. Otherwise, you can sign out and try a different Google account.</p>
    <a href="/.auth/logout">Sign out</a>
  </div>
  <script>
    fetch("/.auth/me")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var principal = data && data.clientPrincipal;
        var el = document.getElementById("who");
        if (principal && principal.userDetails) {
          el.textContent = "Signed in as " + principal.userDetails;
        } else {
          el.textContent = "Not currently signed in.";
        }
      })
      .catch(function () {
        document.getElementById("who").textContent = "";
      });
  </script>
</body>
</html>
